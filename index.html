<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>おでかけ＆グルメ選べるルーレット</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #1f2937;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: var(--card);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 20px;
      color: var(--primary);
    }
    .section-title {
      font-weight: bold;
      margin-bottom: 12px;
      display: block;
    }
    .category-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 24px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      padding: 8px 16px;
      border-radius: 20px;
      background: #f3f4f6;
      color: var(--text);
      cursor: pointer;
      font-size: 0.95rem;
      user-select: none;
      border: 1px solid #d1d5db;
      transition: all 0.2s ease;
    }
    .chip:has(input:checked) {
      background: #eef2ff;
      color: var(--primary);
      border-color: #818cf8;
      font-weight: bold;
    }
    .chip input {
      margin-right: 8px;
    }
    .btn-primary {
      width: 100%;
      background: var(--primary);
      color: white;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }
    .result-box {
      text-align: center;
      margin-top: 24px;
      padding: 20px;
      border: 2px dashed var(--primary);
      border-radius: 12px;
      background: #f8fafc;
    }
    .result-name {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--primary);
      margin: 12px 0;
    }
    .hidden {
      display: none !important;
    }
    .map-link {
      display: inline-block;
      margin-top: 12px;
      color: #059669;
      text-decoration: none;
      font-weight: bold;
    }
    .error-box {
      background-color: #fef2f2;
      border: 1px solid #fca5a5;
      color: #991b1b;
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🎲 おでかけ＆グルメルーレット</h1>

  <div id="status-msg" style="text-align: center; padding: 20px; color: #4b5563;">
    ⏳ スプレッドシートからデータを取得中...
  </div>

  <div id="error-container" class="error-box hidden"></div>

  <div id="app" class="hidden">
    <!-- カテゴリー選択 -->
    <div>
      <span class="section-title">1. カテゴリー（気分）を選ぶ</span>
      <div id="categoryContainer" class="category-group"></div>
    </div>

    <button type="button" class="btn-primary" onclick="spinRoulette()">ルーレットを回す！ 🎰</button>

    <!-- 結果表示画面 -->
    <div id="resultBox" class="result-box hidden">
      <div>本日の決定はこちら！</div>
      <div id="resultTitle" class="result-name">---</div>
      <div id="resultMeta" style="color: #6b7280; font-size: 0.9rem;"></div>
      <a id="mapLink" class="map-link" href="#" target="_blank" rel="noopener">Googleマップで近くを探す 📍</a>
    </div>
  </div>
</div>

<script>
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwGhGXvn-tvcBW0osTJvc8-4AmZ-C6hEsF49HYHN_b7RxOaVURyM-CR1xcmHmywU89dtg/exec";

  let allData = [];

  async function fetchData() {
    const statusEl = document.getElementById('status-msg');
    const errorEl = document.getElementById('error-container');

    try {
      const res = await fetch(GAS_API_URL);
      if (!res.ok) throw new Error(`HTTPエラー（ステータス: ${res.status}）`);

      const rawData = await res.json();
      
      if (!Array.isArray(rawData) || rawData.length === 0) {
        statusEl.classList.add('hidden');
        errorEl.classList.remove('hidden');
        errorEl.innerHTML = "⚠️ データが空です。";
        return;
      }

      // 配列形式（2次元配列）とオブジェクト形式（JSON）の両方に対応
      if (Array.isArray(rawData[0])) {
        // スプレッドシートそのままの2次元配列の場合
        const rows = rawData.slice(1);
        allData = rows.map(r => ({
          name: r[0] || "",
          time: r[1] || "指定なし",
          category: r[2] || "その他",
          budget: r[3] || "指定なし"
        })).filter(r => r.name !== "");
      } else {
        // キー（オブジェクト）形式の場合
        allData = rawData.map(item => ({
          name: item.name || item["名称"] || item.title || "",
          time: item.time || item["時間"] || "指定なし",
          budget: item.budget || item["予算"] || "指定なし",
          category: item.category || item.move || item["カテゴリー"] || item["気分"] || "その他"
        })).filter(item => item.name !== "");
      }

      statusEl.classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      initCategoryFilter();

    } catch (e) {
      statusEl.classList.add('hidden');
      errorEl.classList.remove('hidden');
      errorEl.innerHTML = `🚨 <strong>データの取得に失敗しました：</strong><br>${e.message}`;
    }
  }

  function initCategoryFilter() {
    // 重複のないカテゴリー一覧を取得
    const rawCategories = [...new Set(allData.map(d => d.category))].filter(Boolean);
    
    // 「指定なし」を先頭に追加
    const categories = ["指定なし", ...rawCategories];
    
    const container = document.getElementById('categoryContainer');
    container.innerHTML = '';

    categories.forEach((cat, index) => {
      const label = document.createElement('label');
      label.className = 'chip';
      // デフォルトで「指定なし」（index: 0）を選択状態にする
      const isChecked = index === 0 ? 'checked' : '';
      label.innerHTML = `<input type="radio" name="categorySelect" value="${cat}" ${isChecked}> ${cat}`;
      container.appendChild(label);
    });
  }

  function spinRoulette() {
    const selectedRadio = document.querySelector('input[name="categorySelect"]:checked');
    const selectedCat = selectedRadio ? selectedRadio.value : "指定なし";

    // 「指定なし」の場合は全データ、それ以外は選ばれたカテゴリーで絞り込み
    let filtered = allData;
    if (selectedCat !== "指定なし") {
      filtered = allData.filter(item => item.category === selectedCat);
    }

    if (filtered.length === 0) {
      alert("選択したカテゴリーに該当するデータがありません。");
      return;
    }

    const resultBox = document.getElementById('resultBox');
    const resultTitle = document.getElementById('resultTitle');
    const resultMeta = document.getElementById('resultMeta');
    const mapLink = document.getElementById('mapLink');

    resultBox.classList.remove('hidden');

    let count = 0;
    const interval = setInterval(() => {
      const randomItem = filtered[Math.floor(Math.random() * filtered.length)];
      resultTitle.innerText = randomItem.name;
      count++;
      
      if (count > 15) {
        clearInterval(interval);
        const finalItem = filtered[Math.floor(Math.random() * filtered.length)];
        resultTitle.innerText = `🎯 ${finalItem.name}`;
        resultMeta.innerText = `[${finalItem.category}] 予算:${finalItem.budget} / 時間:${finalItem.time}`;
        mapLink.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(finalItem.name)}`;
      }
    }, 100);
  }

  window.addEventListener('DOMContentLoaded', fetchData);
</script>
</body>
</html>
