<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>おでかけ＆グルメ選べるルーレット</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #1f2937;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: var(--card);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 20px;
      color: var(--primary);
    }
    .section-title {
      font-weight: bold;
      margin-bottom: 8px;
      display: block;
    }
    .category-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      border-radius: 20px;
      background: #eef2ff;
      color: var(--primary);
      cursor: pointer;
      font-size: 0.9rem;
      user-select: none;
      border: 1px solid #c7d2fe;
    }
    .chip input {
      margin-right: 6px;
    }
    .btn-group-sm {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .btn-sm {
      padding: 6px 12px;
      font-size: 0.85rem;
      border: 1px solid #c7d2fe;
      background: #fff;
      color: var(--primary);
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-primary {
      width: 100%;
      background: var(--primary);
      color: white;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }
    .result-box {
      text-align: center;
      margin-top: 24px;
      padding: 20px;
      border: 2px dashed var(--primary);
      border-radius: 12px;
      background: #f8fafc;
    }
    .result-name {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--primary);
      margin: 10px 0;
    }
    .hidden {
      display: none !important;
    }
    .map-link {
      display: inline-block;
      margin-top: 12px;
      color: #059669;
      text-decoration: none;
      font-weight: bold;
    }
    .error-box {
      background-color: #fef2f2;
      border: 1px solid #fca5a5;
      color: #991b1b;
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🎲 おでかけ＆グルメルーレット</h1>

  <div id="status-msg" style="text-align: center; padding: 20px; color: #4b5563;">
    ⏳ スプレッドシートからデータを取得中...
  </div>

  <div id="error-container" class="error-box hidden"></div>

  <div id="app" class="hidden">
    <!-- カテゴリー選択 -->
    <div>
      <span class="section-title">1. カテゴリーを選ぶ</span>
      <div class="btn-group-sm">
        <button type="button" class="btn-sm" onclick="selectAllCategories(true)">全選択</button>
        <button type="button" class="btn-sm" onclick="selectAllCategories(false)">全解除</button>
      </div>
      <div id="categoryContainer" class="category-group"></div>
    </div>

    <button type="button" class="btn-primary" onclick="spinRoulette()">ルーレットを回す！ 🎰</button>

    <!-- 結果表示画面 -->
    <div id="resultBox" class="result-box hidden">
      <div>本日の決定はこちら！</div>
      <div id="resultTitle" class="result-name">---</div>
      <div id="resultMeta" style="color: #6b7280; font-size: 0.9rem;"></div>
      <a id="mapLink" class="map-link" href="#" target="_blank" rel="noopener">Googleマップで近くを探す 📍</a>
    </div>
  </div>
</div>

<script>
  // ⚠️【最重要】ここにご自身の「GAS（ウェブアプリ）URL」を貼り付けてください！
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwGhGXvn-tvcBW0osTJvc8-4AmZ-C6hEsF49HYHN_b7RxOaVURyM-CR1xcmHmywU89dtg/exec";

  let allData = [];

  async function fetchData() {
    const statusEl = document.getElementById('status-msg');
    const errorEl = document.getElementById('error-container');

    // URLが未設定の場合のチェック
    if (!GAS_API_URL || GAS_API_URL.includes("ここにデプロイしたURLを貼り付け") || GAS_API_URL.includes("YOUR_SCRIPT_ID")) {
      statusEl.classList.add('hidden');
      errorEl.classList.remove('hidden');
      errorEl.innerHTML = "🚨 <strong>GASのURLが貼り付けられていません！</strong><br>コードの118行目あたりにある <code>const GAS_API_URL = \"...\";</code> の中に、デプロイしたGASのWebアプリURLを貼り付けてください。";
      return;
    }

    try {
      const res = await fetch(GAS_API_URL);
      if (!res.ok) {
        throw new Error(`HTTPエラー（ステータス: ${res.status}）`);
      }
      const rawData = await res.json();
      
      let rows = Array.isArray(rawData) ? rawData : (rawData.data || rawData.result);
      
      if (!rows || !Array.isArray(rows) || rows.length <= 1) {
        statusEl.classList.add('hidden');
        errorEl.classList.remove('hidden');
        errorEl.innerHTML = "⚠️ <strong>スプレッドシートのデータが空です。</strong><br>スプレッドシートにデータが入力されているか確認してください。";
        return;
      }

      // 見出し(1行目)を除外
      const contentRows = rows.slice(1);
      
      allData = contentRows.map(r => {
        if (!Array.isArray(r)) return null;
        return {
          name: r[0] ? String(r[0]).trim() : "",
          time: r[1] ? String(r[1]).trim() : "",
          active: r[2] ? String(r[2]).trim() : "",
          budget: r[3] ? String(r[3]).trim() : "",
          category: r[4] ? String(r[4]).trim() : "その他"
        };
      }).filter(item => item && item.name !== "");

      if (allData.length === 0) {
        statusEl.classList.add('hidden');
        errorEl.classList.remove('hidden');
        errorEl.innerHTML = "⚠️ <strong>有効なデータが見つかりませんでした。</strong><br>スプレッドシートのA列（名称）に文字が入っているか確認してください。";
        return;
      }

      statusEl.classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      initCategoryFilter();

    } catch (e) {
      statusEl.classList.add('hidden');
      errorEl.classList.remove('hidden');
      errorEl.innerHTML = `🚨 <strong>データの取得に失敗しました：</strong><br>${e.message}<br><br>【考えられる原因】<br>1. GASのデプロイで「アクセスできるユーザー」が「全員」になっていない<br>2. 貼り付けたURLが間違っている`;
    }
  }

  function initCategoryFilter() {
    const categories = [...new Set(allData.map(d => d.category))].filter(Boolean);
    const container = document.getElementById('categoryContainer');
    container.innerHTML = '';

    categories.forEach(cat => {
      const label = document.createElement('label');
      label.className = 'chip';
      label.innerHTML = `<input type="checkbox" value="${cat}" checked> ${cat}`;
      container.appendChild(label);
    });
  }

  function selectAllCategories(status) {
    const checkboxes = document.querySelectorAll('#categoryContainer input[type="checkbox"]');
    checkboxes.forEach(cb => cb.checked = status);
  }

  function spinRoulette() {
    const selectedBoxes = document.querySelectorAll('#categoryContainer input[type="checkbox"]:checked');
    const selectedCats = Array.from(selectedBoxes).map(cb => cb.value);
    
    if (selectedCats.length === 0) {
      alert("カテゴリーを1つ以上選んでください！");
      return;
    }

    const filtered = allData.filter(item => selectedCats.includes(item.category));

    if (filtered.length === 0) {
      alert("選択したカテゴリーに該当するデータがありません。");
      return;
    }

    const resultBox = document.getElementById('resultBox');
    const resultTitle = document.getElementById('resultTitle');
    const resultMeta = document.getElementById('resultMeta');
    const mapLink = document.getElementById('mapLink');

    resultBox.classList.remove('hidden');

    let count = 0;
    const interval = setInterval(() => {
      const randomItem = filtered[Math.floor(Math.random() * filtered.length)];
      resultTitle.innerText = randomItem.name;
      count++;
      
      if (count > 15) {
        clearInterval(interval);
        const finalItem = filtered[Math.floor(Math.random() * filtered.length)];
        resultTitle.innerText = `🎯 ${finalItem.name}`;
        resultMeta.innerText = `[${finalItem.category}] 予算:${finalItem.budget} / 時間:${finalItem.time}`;
        mapLink.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(finalItem.name)}`;
      }
    }, 100);
  }

  window.addEventListener('DOMContentLoaded', fetchData);
</script>
</body>
</html>
