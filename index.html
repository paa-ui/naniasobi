<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>おでかけ＆グルメ選べるルーレット</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #1f2937;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: var(--card);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 20px;
      color: var(--primary);
    }
    .section-title {
      font-weight: bold;
      margin-bottom: 8px;
      display: block;
    }
    .category-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      border-radius: 20px;
      background: #eef2ff;
      color: var(--primary);
      cursor: pointer;
      font-size: 0.9rem;
      user-select: none;
      border: 1px solid #c7d2fe;
    }
    .chip input {
      margin-right: 6px;
    }
    .btn-group-sm {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .btn-sm {
      padding: 4px 10px;
      font-size: 0.8rem;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-primary {
      width: 100%;
      background: var(--primary);
      color: white;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }
    .result-box {
      text-align: center;
      margin-top: 24px;
      padding: 20px;
      border: 2px dashed var(--primary);
      border-radius: 12px;
      background: #f8fafc;
    }
    .result-name {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--primary);
      margin: 10px 0;
    }
    .hidden {
      display: none;
    }
    .map-link {
      display: inline-block;
      margin-top: 12px;
      color: #059669;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🎲 おでかけ＆グルメルーレット</h1>

  <div id="loading">スプレッドシートからデータを取得中...</div>

  <div id="app" class="hidden">
    <!-- カテゴリー選択 -->
    <div>
      <span class="section-title">1. カテゴリーを選ぶ</span>
      <div class="btn-group-sm">
        <button class="btn-sm" onclick="selectAllCategories(true)">全選択</button>
        <button class="btn-sm" onclick="selectAllCategories(false)">全解除</button>
      </div>
      <div id="categoryContainer" class="category-group"></div>
    </div>

    <button class="btn-primary" onclick="spinRoulette()">ルーレットを回す！ 🎰</button>

    <!-- 結果表示画面 -->
    <div id="resultBox" class="result-box hidden">
      <div>本日の決定はこちら！</div>
      <div id="resultTitle" class="result-name">---</div>
      <div id="resultMeta" style="color: #6b7280; font-size: 0.9rem;"></div>
      <a id="mapLink" class="map-link" href="#" target="_blank">Googleマップで近くを探す 📍</a>
    </div>
  </div>
</div>

<script>
  // ★ ここにご自身のGAS（ウェブアプリ）URLを入力してください
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwGhGXvn-tvcBW0osTJvc8-4AmZ-C6hEsF49HYHN_b7RxOaVURyM-CR1xcmHmywU89dtg/exec";

  let allData = [];

  // GASからデータ取得
  async function fetchData() {
    try {
      const res = await fetch(GAS_API_URL);
      const data = await res.json();
      
      // ヘッダー除外 (1行目が見出しの場合)
      const rows = data.slice(1);
      
      allData = rows.map(r => ({
        name: r[0],
        time: r[1],
        active: r[2],
        budget: r[3],
        category: r[4] || "その他"
      })).filter(item => item.name);

      initCategoryFilter();
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
    } catch (e) {
      document.getElementById('loading').innerText = "データの取得に失敗しました。URLや設定を確認してください。";
    }
  }

  // カテゴリーチェックボックスの自動生成
  function initCategoryFilter() {
    const categories = [...new Set(allData.map(d => d.category))];
    const container = document.getElementById('categoryContainer');
    container.innerHTML = '';

    categories.forEach(cat => {
      const label = document.createElement('label');
      label.className = 'chip';
      label.innerHTML = `<input type="checkbox" value="${cat}" checked> ${cat}`;
      container.appendChild(label);
    });
  }

  function selectAllCategories(status) {
    const checkboxes = document.querySelectorAll('#categoryContainer input');
    checkboxes.forEach(cb => cb.checked = status);
  }

  // ルーレット処理
  function spinRoulette() {
    const selectedCats = Array.from(document.querySelectorAll('#categoryContainer input:checked')).map(cb => cb.value);
    
    if (selectedCats.length === 0) {
      alert("カテゴリーを1つ以上選んでください！");
      return;
    }

    const filtered = allData.filter(item => selectedCats.includes(item.category));

    if (filtered.length === 0) {
      alert("該当する項目がありませんでした。");
      return;
    }

    const resultBox = document.getElementById('resultBox');
    const resultTitle = document.getElementById('resultTitle');
    const resultMeta = document.getElementById('resultMeta');
    const mapLink = document.getElementById('mapLink');

    resultBox.classList.remove('hidden');

    // シャッフル演出
    let count = 0;
    const interval = setInterval(() => {
      const randomItem = filtered[Math.floor(Math.random() * filtered.length)];
      resultTitle.innerText = randomItem.name;
      count++;
      
      if (count > 15) {
        clearInterval(interval);
        // 最終決定
        const finalItem = filtered[Math.floor(Math.random() * filtered.length)];
        resultTitle.innerText = finalItem.name;
        resultMeta.innerText = `[${finalItem.category}] 予算:${finalItem.budget} / 時間:${finalItem.time}`;
        mapLink.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(finalItem.name)}`;
      }
    }, 100);
  }

  fetchData();
</script>

</body>
</html>
