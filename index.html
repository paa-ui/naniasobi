<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>わくわくルーレッツ🎯</title>
  <style>
    :root {
      --primary: #FF6B6B;
      --secondary: #4ECDC4;
      --bg: #F7F9FC;
      --card: #FFFFFF;
      --text: #2D3748;
    }

    * {
      box-sizing: border-box;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      background: var(--card);
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      align-self: center;
    }

    h1 {
      text-align: center;
      font-size: 1.6rem;
      color: var(--primary);
      margin-top: 0;
    }

    .step {
      display: none;
    }

    .step.active {
      display: block;
    }

    .question-group {
      margin-bottom: 20px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 8px;
    }

    select {
      width: 100%;
      padding: 12px;
      border: 2px solid #E2E8F0;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      background: #FFF;
    }

    .btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
      margin-top: 10px;
    }

    .btn:disabled {
      background: #CBD5E0;
      cursor: not-allowed;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: var(--secondary);
    }

    .candidate-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 20px 0;
      max-height: 300px;
      overflow-y: auto;
    }

    .candidate-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border: 2px solid #E2E8F0;
      border-radius: 10px;
      cursor: pointer;
    }

    .candidate-item input {
      margin-right: 12px;
      transform: scale(1.2);
    }

    .roulette-display {
      height: 120px;
      border: 4px dashed var(--secondary);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--primary);
      margin: 20px 0;
      background: #FAF5FF;
      text-align: center;
      padding: 10px;
    }

    .map-link {
      display: block;
      text-align: center;
      background: #4285F4;
      color: white;
      text-decoration: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: bold;
      margin-top: 15px;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #718096;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>わくわくルーレッツ🎯</h1>

  <!-- STEP 1: 質問回答 -->
  <div id="step-1" class="step active">
    <div id="loading-msg" class="loading">スプレッドシートから候補を読み込み中...</div>
    
    <div id="form-content" style="display: none;">
      <div class="question-group">
        <label>1. 遊ぶ時間は？</label>
        <select id="q-time">
          <option value="all">指定なし</option>
          <option value="allday">1日中</option>
          <option value="day">昼</option>
          <option value="night">夜</option>
        </select>
      </div>

      <div class="question-group">
        <label>2. 動き方は？</label>
        <select id="q-move">
          <option value="all">指定なし</option>
          <option value="active">体を動かす</option>
          <option value="relax">まったり</option>
        </select>
      </div>

      <div class="question-group">
        <label>3. 予算は？</label>
        <select id="q-budget">
          <option value="all">指定なし</option>
          <option value="low">低予算</option>
          <option value="mid">～1万以内</option>
        </select>
      </div>

      <button class="btn" id="search-btn" onclick="goToStep2()">候補を探す！</button>
    </div>
  </div>

  <!-- STEP 2: 候補選択 -->
  <div id="step-2" class="step">
    <h3>ルーレットに入れる候補を選んでね</h3>
    <div class="candidate-list" id="candidate-container"></div>
    <button class="btn" onclick="startRoulette()">ルーレットへ進む</button>
  </div>

  <!-- STEP 3: ルーレット＆結果 -->
  <div id="step-3" class="step">
    <h3>運命の決定...！</h3>
    <div class="roulette-display" id="roulette-box">❓</div>
    <button class="btn" id="spin-btn" onclick="spinRoulette()">ルーレットを回す！</button>
    <a id="map-btn" class="map-link" style="display: none;" target="_blank" rel="noopener">Googleマップで近くを探す 📍</a>
    <button class="btn btn-secondary" id="retry-btn" style="display: none; margin-top: 10px;" onclick="resetApp()">もう一度最初から</button>
  </div>
</div>

<script>
  // ⚠️ ここにご自身の「ウェブアプリ URL」を貼り付けてください
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwGhGXvn-tvcBW0osTJvc8-4AmZ-C6hEsF49HYHN_b7RxOaVURyM-CR1xcmHmywU89dtg/exec";

  let activities = [];
  let selectedCandidates = [];

  // 起動時にスプレッドシートからデータ取得
  window.addEventListener('DOMContentLoaded', () => {
    fetch(GAS_API_URL)
      .then(response => response.json())
      .then(data => {
        activities = data;
        document.getElementById('loading-msg').style.display = 'none';
        document.getElementById('form-content').style.display = 'block';
      })
      .catch(error => {
        console.error('Error:', error);
        document.getElementById('loading-msg').innerText = 'データの取得に失敗しました。URLを確認してください。';
      });
  });

  function goToStep2() {
    const time = document.getElementById('q-time').value;
    const move = document.getElementById('q-move').value;
    const budget = document.getElementById('q-budget').value;

    const filtered = activities.filter(act => {
      if (time !== 'all' && act.time !== time && act.time !== 'all') return false;
      if (move !== 'all' && act.move !== move && act.move !== 'all') return false;
      if (budget !== 'all' && act.budget !== budget && act.budget !== 'all') return false;
      return true;
    });

    const container = document.getElementById('candidate-container');
    container.innerHTML = '';

    const listToDisplay = filtered.length > 0 ? filtered : activities;

    listToDisplay.forEach((act) => {
      const item = document.createElement('label');
      item.className = 'candidate-item';
      item.innerHTML = `
        <input type="checkbox" value="${act.name}" checked>
        <span>${act.name}</span>
      `;
      container.appendChild(item);
    });

    showStep(2);
  }

  function startRoulette() {
    const checkboxes = document.querySelectorAll('#candidate-container input[type="checkbox"]:checked');
    selectedCandidates = Array.from(checkboxes).map(cb => cb.value);

    if (selectedCandidates.length === 0) {
      alert('少なくとも1つ候補を選んでください！');
      return;
    }

    document.getElementById('roulette-box').innerText = '準備完了！';
    document.getElementById('spin-btn').style.display = 'block';
    document.getElementById('map-btn').style.display = 'none';
    document.getElementById('retry-btn').style.display = 'none';

    showStep(3);
  }

  function spinRoulette() {
    const spinBtn = document.getElementById('spin-btn');
    const rouletteBox = document.getElementById('roulette-box');
    spinBtn.disabled = true;

    let count = 0;
    const maxSpins = 25;
    const interval = setInterval(() => {
      const randomIndex = Math.floor(Math.random() * selectedCandidates.length);
      rouletteBox.innerText = selectedCandidates[randomIndex];
      count++;

      if (count >= maxSpins) {
        clearInterval(interval);
        const finalChoice = selectedCandidates[Math.floor(Math.random() * selectedCandidates.length)];
        rouletteBox.innerText = `🎯 ${finalChoice}`;

        const mapBtn = document.getElementById('map-btn');
        mapBtn.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(finalChoice)}`;
        mapBtn.innerText = `近くの「${finalChoice}」を Google マップで探す 📍`;
        mapBtn.style.display = 'block';

        spinBtn.style.display = 'none';
        document.getElementById('retry-btn').style.display = 'block';
        spinBtn.disabled = false;
      }
    }, 80);
  }

  function resetApp() {
    showStep(1);
  }

  function showStep(stepNumber) {
    document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
    document.getElementById(`step-${stepNumber}`).classList.add('active');
  }
</script>

</body>
</html>
